name: Production browser verification

on:
  workflow_dispatch:
  deployment_status:
  # Temporary pre-merge diagnostic trigger for the active remediation branch.
  push:
    branches:
      - arena/bc0a8c5c-web-dxn
    paths:
      - scripts/production-browser-check.mjs
      - .github/workflows/production-browser.yml

permissions:
  contents: read
  checks: write

jobs:
  browser:
    name: Real-browser production rendering check
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Puppeteer with Chromium
        run: npm install --no-save --no-audit --no-fund puppeteer@25.17.0

      - name: Verify production renders in a real browser
        run: node scripts/production-browser-check.mjs
        env:
          PRODUCTION_URL: https://dxnnadz.vercel.app
          BROWSER_REPORT_DIR: browser-report
          BROWSER_MODES: normal,blocked-storage

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-report
          path: browser-report/

      # The sandbox cannot download Actions artifact/log blobs (egress allowlist),
      # so also publish the evidence as a Check Run output readable via the API.
      - name: Publish browser evidence check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'browser-report/production-browser-report.json';
            if (!fs.existsSync(reportPath)) {
              core.setFailed('Browser report was not produced');
              return;
            }
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const rows = report.results.map((r) =>
              `| ${r.mode} | ${r.route} | ${r.ok ? 'PASS' : 'FAIL'} | ${r.httpStatus ?? r.error ?? ''} | ${r.info?.rootChildren ?? ''} | ${r.pageErrors?.length ?? ''} | ${r.cdpExceptions?.length ?? ''} | ${r.apiChecks?.health?.ok ?? ''} | ${r.apiChecks?.products?.ok ?? ''} | ${r.routeOk ?? ''} |`
            ).join('\n');
            const summary = [
              `Base: ${report.base}`,
              `Checked at: ${report.checkedAt}`,
              `Overall: ${report.failed ? 'FAIL' : 'PASS'}`,
              '',
              '| Mode | Route | Result | HTTP | #root children | pageerrors | CDP exceptions | health API | products API | route UI |',
              '|---|---|---|---|---|---|---|---|---|---|',
              rows,
            ].join('\n');
            // Compact evidence only: the full report lives in the uploaded artifact.
            // GitHub caps each check-output field at 65535 chars, so keep this small.
            const cap = (s, n) => (typeof s === 'string' ? s.slice(0, n) : s);
            const evidence = report.results.map((r) => {
              const ex = r.cdpExceptions?.[0];
              const props = {};
              for (const p of ex?.exception?.preview?.properties || []) props[p.name] = p.value;
              return {
                route: r.route,
                mode: r.mode,
                ok: r.ok,
                httpStatus: r.httpStatus,
                error: cap(r.error, 300),
                title: r.info?.title,
                rootChildren: r.info?.rootChildren,
                entryScript: r.info?.entryScript,
                healthOk: r.apiChecks?.health?.ok,
                productsOk: r.apiChecks?.products?.ok,
                assetFailures: r.assetFailures,
                pageErrors: (r.pageErrors || []).map((e) => ({ message: cap(e.message, 300), stack: cap(e.stack, 1000) })),
                firstCdpException: ex ? {
                  text: ex.text,
                  className: ex.exception?.className,
                  description: cap(ex.exception?.description, 500),
                  name: props.name,
                  message: props.message,
                  code: props.code,
                } : undefined,
                debuggerFrames: (r.debuggerFrames || []).slice(0, 1).map((f) => ({
                  reason: f.reason,
                  callFrames: (f.callFrames || []).slice(0, 4),
                })),
              };
            });
            const text = JSON.stringify(evidence, null, 2);
            core.info(`Evidence text length: ${text.length} chars (limit 65535)`);
            if (text.length > 60000) {
              core.setFailed(`Evidence text too large (${text.length} chars); refusing to publish`);
              return;
            }
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Production browser evidence',
              head_sha: context.sha,
              status: 'completed',
              conclusion: report.failed ? 'failure' : 'success',
              output: {
                title: report.failed ? 'Production browser rendering FAILED' : 'Production browser rendering PASSED',
                summary,
                text,
              },
            });
            core.info(`Created check run ${check.data.id}: ${check.data.html_url}`);
