name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  verify:
    name: Typecheck, Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit / DB-free test suites
        run: npm run test:unit

      - name: AI & messaging safety test suites
        run: npm run test:ai
