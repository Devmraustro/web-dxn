name: DXN NADZ CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: dxn-nadz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      # Link-time integrity of the emitted bundle: every HTML asset reference
      # must exist and every named import must be exported by the chunk it is
      # imported from. A missing export blanks the page before React mounts, so
      # this gate is cheaper and stricter than any post-mount smoke test.
      - name: Bundle integrity (emitted production build)
        run: npm run check:bundle-integrity

      - name: Browser-verification harness tests
        run: npm run test:harness

      - name: Unit test suite
        run: npm run test:unit -- --coverage=false

      - name: AI and messaging safety test suite
        run: npm run test:ai -- --coverage=false

  live-assets:
    name: Live deployment bundle integrity
    # Fetches the assets the production domain actually serves, verifies the
    # served module graph links, and diffs every served chunk against the build
    # of this commit. A deployment that serves chunks from more than one build —
    # or a truncated/stale chunk at an immutable /assets/* URL — is detected here
    # instead of in a user's browser.
    #
    # While the deployed commit is known to be broken this job records evidence
    # without failing the workflow (the corrective build is not deployed yet).
    # Remove `continue-on-error` from the probe steps once this lands on main so
    # the probe is a hard gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production build (reference build for comparison)
        run: npm run build

      - name: Probe deployed assets (as browsers receive them)
        continue-on-error: true
        run: |
          node scripts/check-bundle-integrity.mjs \
            --url "$PRODUCTION_URL" \
            --compare-dir dist/frontend/build \
            --json browser-report/live-assets.json \
            --verbose
        env:
          PRODUCTION_URL: https://dxnnadz.vercel.app

      - name: Probe deployed assets (origin, cache bypassed)
        continue-on-error: true
        run: |
          node scripts/check-bundle-integrity.mjs \
            --url "$PRODUCTION_URL" \
            --fresh \
            --compare-dir dist/frontend/build \
            --json browser-report/live-assets-fresh.json \
            --verbose
        env:
          PRODUCTION_URL: https://dxnnadz.vercel.app

      - name: Print served-asset summary
        if: always()
        run: |
          if [ -f browser-report/live-assets.json ]; then
            node -e '
              const r = require("./browser-report/live-assets.json");
              console.log(`document: HTTP ${r.document?.status} sha256 ${r.document?.sha256?.slice(0,16)} cache-control=${r.document?.cacheControl}`);
              console.log(`integrity: ${r.integrity.ok ? "PASS" : "FAIL"} (${r.integrity.checkedModules} modules, ${r.integrity.checkedImports} imports)`);
              for (const a of r.servedAssets) console.log(`asset ${a.status} ${String(a.bytes).padStart(8)}B ${a.sha256.slice(0,16)} edge=${a.vercelCache || "-"} ${a.path}`);
              for (const e of r.integrity.errors) console.log(`::error file=${e.file}::${e.detail}`);
              for (const d of r.comparison) console.log(`::warning::${d.reason}: ${d.path}${d.served ? ` served=${d.served.slice(0,16)} local=${d.local.slice(0,16)}` : ""}`);
            '
          else
            echo "no report produced"
          fi

      # Artifact and log blobs are not reachable from every environment, so the
      # evidence is also published as a check run output, readable with
      #   gh api repos/{owner}/{repo}/check-runs/{id} --jq .output.text
      - name: Publish live asset evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => (fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : null);
            const cached = read('browser-report/live-assets.json');
            const fresh = read('browser-report/live-assets-fresh.json');
            const report = { cached, fresh };
            if (!cached) {
              core.setFailed('live asset probe produced no report');
              return;
            }
            const lines = [];
            lines.push(`Document: HTTP ${cached.document?.status} · sha256 ${cached.document?.sha256} · cache-control: ${cached.document?.cacheControl}`);
            lines.push(`Served graph links: ${cached.integrity.ok ? 'YES (PASS)' : 'NO (FAIL)'} — ${cached.integrity.checkedModules} modules, ${cached.integrity.checkedImports} named imports`);
            lines.push('');
            lines.push('Served assets (as a browser receives them):');
            for (const asset of cached.servedAssets) {
              lines.push(`  HTTP ${asset.status}  ${String(asset.bytes).padStart(8)} B  ${asset.sha256}  edge=${asset.vercelCache || '-'} age=${asset.age || '-'}  ${asset.path}`);
            }
            if (fresh) {
              lines.push('');
              lines.push('Origin assets (cache-bypassed):');
              for (const asset of fresh.servedAssets) {
                lines.push(`  HTTP ${asset.status}  ${String(asset.bytes).padStart(8)} B  ${asset.sha256}  edge=${asset.vercelCache || '-'}  ${asset.path}`);
              }
            }
            if (cached.integrity.errors.length || cached.integrity.warnings.length) {
              lines.push('');
              lines.push('Link errors / warnings:');
              for (const e of cached.integrity.errors) lines.push(`  ERROR ${e.reason}: ${e.detail}`);
              for (const w of cached.integrity.warnings) lines.push(`  WARN ${w.reason}: ${w.file} -> ${w.specifier}`);
            }
            const text = JSON.stringify(report).length > 60000
              ? JSON.stringify({ note: 'report truncated', document: cached.document, integrity: cached.integrity, servedAssets: cached.servedAssets })
              : JSON.stringify(report);
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Live asset integrity evidence',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: cached.integrity.ok
                  ? 'Served bundle links; served assets differ from this build (expected before deploy)'
                  : 'Served bundle FAILS to link',
                summary: lines.join('\n'),
                text,
              },
            });
            core.info(`Published live asset evidence: ${check.data.html_url}`);

      - name: Upload live asset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-asset-integrity
          path: browser-report/

  live-browser:
    name: Live production browser probe
    # Renders the deployed site in headless Chromium in a fresh profile: proves
    # whether the production page mounts React and whether a module-linking
    # SyntaxError is raised by the bytes the edge actually serves.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Puppeteer with Chromium
        run: npm install --no-save --no-audit --no-fund puppeteer@25.17.0

      - name: Probe the deployed site in a real browser
        continue-on-error: true
        run: node scripts/production-browser-check.mjs
        env:
          PRODUCTION_URL: https://dxnnadz.vercel.app
          BROWSER_TARGET: production
          EXPECT_DB_CONNECTED: "0"
          HARNESS_SELF_TEST: "0"
          BROWSER_MODES: normal,blocked-storage
          BROWSER_ROUTES: "/,/join,/products"
          BROWSER_REPORT_DIR: browser-report

      - name: Publish live browser evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'browser-report/production-browser-report.json';
            if (!fs.existsSync(p)) {
              core.setFailed('live browser probe produced no report');
              return;
            }
            const report = JSON.parse(fs.readFileSync(p, 'utf8'));
            let text = JSON.stringify(report);
            if (text.length > 60000) text = JSON.stringify({ note: 'truncated', failed: report.failed, cases: report.cases?.map((c) => ({ name: c.name, ok: c.ok, errors: c.pageErrors })) });
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Live production browser evidence',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: report.failed ? 'Live production FAILED browser verification' : 'Live production PASSED browser verification',
                summary: fs.existsSync('browser-report/check-run-summary.md')
                  ? fs.readFileSync('browser-report/check-run-summary.md', 'utf8')
                  : `Overall: ${report.failed ? 'FAIL' : 'PASS'}`,
                text,
              },
            });
            core.info(`Published live browser evidence: ${check.data.html_url}`);

      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-browser-report
          path: browser-report/
