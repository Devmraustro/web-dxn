name: DXN NADZ CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dxn-nadz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Browser-verification harness tests
        run: npm run test:harness

      - name: Unit test suite
        run: npm run test:unit -- --coverage=false

      - name: AI and messaging safety test suite
        run: npm run test:ai -- --coverage=false
